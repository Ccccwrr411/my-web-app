name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t my-web-app:${{ github.sha }} .
        docker tag my-web-app:${{ github.sha }} my-web-app:latest
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: Push to Docker Hub
      run: |
        docker tag my-web-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/my-web-app:${{ github.sha }}
        docker tag my-web-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/my-web-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/my-web-app:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/my-web-app:latest